name: Windows Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win
      
      - name: Take Real Screenshot
        shell: powershell
        run: |
          mkdir screenshots
          
          # Minimize all background windows (like the runner console itself)
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2
          
          # Create screenshot function
          function Test-UIState {
              param([string]$StateName)
              
              if ($StateName -ne "light") {
                  $env:TEST_STATE = $StateName
              } else {
                  Remove-Item Env:\TEST_STATE -ErrorAction SilentlyContinue
              }
              
              Start-Process -FilePath "dist/windows/win-unpacked/FloatBoard.exe"
              Start-Sleep -Seconds 12
              
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $Screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $Bitmap = New-Object System.Drawing.Bitmap $Screen.Width, $Screen.Height
              $Graphics = [System.Drawing.Graphics]::FromImage($Bitmap)
              $Graphics.CopyFromScreen($Screen.X, $Screen.Y, 0, 0, $Bitmap.Size)
              $Bitmap.Save("screenshots/screenshot_$StateName.png")
              
              Stop-Process -Name "FloatBoard" -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
          }
          
          # Run tests
          Test-UIState -StateName "light"
          Test-UIState -StateName "dark"
          Test-UIState -StateName "added_screenshot"
          Test-UIState -StateName "deleted_history"
          Test-UIState -StateName "history"
          Test-UIState -StateName "shortcuts"
          Test-UIState -StateName "maximized"
          Test-UIState -StateName "settings"
      
      - uses: actions/upload-artifact@v4
        with:
          name: FloatBoard-Windows-Screenshots
          path: screenshots/*.png
